org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
# Local VM has ~6 GB RAM shared with other agents; keep the Gradle daemon
# small. CI runners use their own defaults (the wrapper still works there).
kotlin.daemon.jvm.options=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# NOTE: no proxy settings are stored here. Local builds behind the VM's
# egress proxy must pass them at build time, e.g.:
#   GRADLE_OPTS="-Dhttps.proxyHost=... -Dhttps.proxyPort=... -Dhttps.proxyUser=... -Dhttps.proxyPassword=..."
# (the proxy token rotates, so it must never be written to a file).
# CI (GitHub Actions) needs no proxy at all.
