org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# CI (GitHub Actions) runs the real build: the default 512m heap OOM'd in
# :app:collectReleaseDependencies (AGP hashes the large OpenCV native libs
# with readBytes). 4g fits the 16 GB CI runners easily. Locally the Gradle
# daemon cannot run on this VM anyway (Java loopback is intercepted), and
# -Xmx is a cap, not committed memory.
kotlin.daemon.jvm.options=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# NOTE: no proxy settings are stored here. Local builds behind the VM's
# egress proxy must pass them at build time, e.g.:
#   GRADLE_OPTS="-Dhttps.proxyHost=... -Dhttps.proxyPort=... -Dhttps.proxyUser=... -Dhttps.proxyPassword=..."
# (the proxy token rotates, so it must never be written to a file).
# CI (GitHub Actions) needs no proxy at all.
