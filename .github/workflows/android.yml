# CI for the 8 Ball Pool Guideline Tool.
#
# HOW TO ADD: the VM's GitHub token has no `workflow` scope, so workflow
# files cannot be pushed from the VM. Add this file via the GitHub web UI:
# repo -> Add file -> Create new file -> path
# `.github/workflows/android.yml` -> paste this content -> Commit.
# Then trigger a run with: gh workflow run android.yml
#
# Two jobs:
#   build — Gradle build + JVM unit tests + assembleRelease APK (artifact).
#   emulator-test — instrumented tests on an API 34 x86_64 emulator, with
#     the overlay permission pre-granted (the overlay tests need it).
#
# SDK setup note (fix for run 43474188020): android-actions/setup-android@v3
# runs `sdkmanager tools`, and the legacy `tools` package no longer exists
# in current cmdline-tools — that step failed with exit code 1 before
# Gradle ever ran. ubuntu-latest runners ship a preinstalled Android SDK
# (ANDROID_HOME set, cmdline-tools/latest present), so we use it directly:
# add cmdline-tools + platform-tools to PATH, accept licenses, and install
# exactly the components the build needs.
#
# Emulator-test fix (run 43475219203): the appops overlay grant ran BEFORE
# the app was installed ("No UID for com.poolguide.tool"), so the script
# must install the debug APK first; boots took 575-800s, so the boot
# timeout is raised to 1200s.
#
# Release signing (fix for v1.0.0 being debug-signed): the build job
# decodes the persistent release keystore from the
# RELEASE_KEYSTORE_BASE64 secret into release.keystore and exports the
# four RELEASE_* env vars, so the release APK is signed with the same
# key on every run (CN=Pool Guide). v1.0.0 shipped debug-signed, so
# v1.0.1 requires uninstall + reinstall once; the signature then stays
# stable for all future releases. The keystore file itself is never
# committed; the backup lives outside the repo.
#
# Emulator reliability fix (runs 43474188020-43496846803, 7 consecutive
# infra failures, only 1 of ~9 attempts ever ran tests): the emulator-test
# job was failing on the runner's emulator/adb layer, never on app code —
# boot timeout, adb broken pipe, adb device offline (every 2s, never
# recovers), ShellCommandUnresponsiveException during installDebug.
# Changes (see workflow-android-EMULATOR-FIX-NOTES.md for the full story):
#   - KVM udev-rule step added (the runner README requires it; it was
#     missing from this workflow).
#   - Target google_apis -> google_atd (Automated Test Device image:
#     ~40% lighter, no Play services background load).
#   - Emulator sized down for the 4-vCPU host: cores 4 -> 2,
#     ram-size 6144M -> 3072M, heap-size 1024M -> 512M.
#   - ADB_INSTALL_TIMEOUT raised to 10 min (default 4 min is too short
#     for a loaded CI emulator).
#   - The test driver moved to scripts/run-instrumented-tests.sh (the
#     runner executes its `script:` input line by line, so multi-line
#     shell logic cannot live inline): adb reset + boot wait, install
#     with retries, overlay grant with retry, test run retried once
#     ONLY on device-offline (infra), never on a real test failure.
#   - Job timeout 45 -> 60 min (the one successful run took 41m39s).
#   - logcat.txt uploaded on failure for diagnosis.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK + run unit tests
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-guide-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    env:
      # Default adb install timeout is 4 minutes — too short for a loaded
      # CI emulator (ShellCommandUnresponsiveException during installDebug).
      ADB_INSTALL_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew and test script
        run: chmod +x gradlew scripts/run-instrumented-tests.sh

      # The overlay tests add real TYPE_APPLICATION_OVERLAY windows, which
      # needs the permission granted first. The script runs line by line.
      # All retry/health logic lives in scripts/run-instrumented-tests.sh
      # (the runner executes its `script:` input line by line via
      # `/usr/bin/sh -c <line>`, so multi-line shell cannot live inline).
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -wipe-data
          script: bash scripts/run-instrumented-tests.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 14

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          retention-days: 14
